<div style="width:100%; height: 100%; padding: 2em; " onkeydown={handleKeydown} onclick={nextSlide}
    onrightclick={previousSlide} oncontextmenu={previousSlide} tabindex="0">
    <div style="position:absolute; top:2em; bottom:2em; left:1em; width:30%; ">
        <ul for:each={_list_} for:item={item}>
            <li>{item}</li>
        </ul>
    </div>
    <div style="position:absolute; top: 2em; right:2em; bottom:2em; width:70%; border:1px solid #fff; padding: 2em; ">
        <h1>{_slideTitle_}</h1>

        <div for:each={_contentParagraphs_} for:item={paragraph}>
            <p>{paragraph}</p>
        </div>
    </div>
</div>
